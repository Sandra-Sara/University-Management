<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>University Management System</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background:
    linear-gradient(
        135deg,
        #0f172a,
        #1e293b,
        #2563eb,
        #38bdf8
    );

    overflow:hidden;
}

/* Background circles */

.circle{
    position:absolute;
    border-radius:50%;
    filter:blur(100px);
}

.circle1{
    width:300px;
    height:300px;
    background:#3b82f6;
    top:-100px;
    left:-100px;
}

.circle2{
    width:250px;
    height:250px;
    background:#06b6d4;
    bottom:-80px;
    right:-80px;
}

.card{

    width:500px;

    background:rgba(255,255,255,0.12);

    backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,0.2);

    border-radius:25px;

    padding:40px;

    text-align:center;

    color:white;

    box-shadow:
    0 20px 50px rgba(0,0,0,0.3);
}

.logo{

    width:90px;
    height:90px;

    margin:auto;
    margin-bottom:20px;

    display:flex;
    justify-content:center;
    align-items:center;

    border-radius:50%;

    background:rgba(255,255,255,0.15);

    font-size:45px;
}

h1{
    margin-bottom:10px;
}

.subtitle{
    color:rgba(255,255,255,0.8);
    margin-bottom:30px;
}

.role-container{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.role-card{

    background:rgba(255,255,255,0.1);

    border:1px solid rgba(255,255,255,0.15);

    border-radius:15px;

    padding:18px;

    cursor:pointer;

    transition:0.3s;
}

.role-card:hover{

    transform:translateY(-5px);

    background:rgba(255,255,255,0.18);
}

.role-card i{
    font-size:35px;
    margin-bottom:10px;
}

.role-card h3{
    margin-bottom:5px;
}

.role-card p{
    font-size:14px;
    color:rgba(255,255,255,0.75);
}

.footer{
    margin-top:25px;
    font-size:13px;
    color:rgba(255,255,255,0.7);
}

</style>
</head>

<body>

<div class="circle circle1"></div>
<div class="circle circle2"></div>

<div class="card">

    <div class="logo">
        <i class="ti ti-school"></i>
    </div>

    <h1>University Management</h1>

    <p class="subtitle">
        Select your role to continue
    </p>

    <div class="role-container">

        <div class="role-card"
        onclick="goToRole('student')">

            <i class="ti ti-user"></i>

            <h3>Student</h3>

            <p>
                Access courses, grades,
                attendance and profile.
            </p>

        </div>

        <div class="role-card"
        onclick="goToRole('teacher')">

            <i class="ti ti-chalkboard"></i>

            <h3>Teacher</h3>

            <p>
                Manage classes, students,
                marks and attendance.
            </p>

        </div>

        <div class="role-card"
        onclick="goToRole('staff')">

            <i class="ti ti-users-group"></i>

            <h3>Staff</h3>

            <p>
                Handle administration,
                records and operations.
            </p>

        </div>

    </div>

    <div class="footer">
        © 2026 University Management System
    </div>

</div>

<script>

function goToRole(role){

    if(role === "student"){
        window.location.href = "/student";
    }

    else if(role === "teacher"){
        window.location.href = "/teacher";
    }

    else if(role === "staff"){
        window.location.href = "/staff";
    }
}

</script>

</body>
</html>
