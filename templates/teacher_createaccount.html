<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Create Account</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(
        135deg,
        #0f172a,
        #1e293b,
        #2563eb,
        #38bdf8
    );
}

.card{
    width:500px;
    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.2);
    border-radius:25px;
    padding:35px;
    color:white;
    box-shadow:0 20px 40px rgba(0,0,0,0.3);
}

.logo{
    width:80px;
    height:80px;
    margin:auto;
    display:flex;
    justify-content:center;
    align-items:center;
    border-radius:50%;
    background:rgba(255,255,255,0.15);
    font-size:40px;
    margin-bottom:20px;
}

h2{
    text-align:center;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:rgba(255,255,255,0.8);
    margin-bottom:25px;
}

.field{
    margin-bottom:15px;
}

label{
    display:block;
    margin-bottom:6px;
}

input{
    width:100%;
    padding:12px;
    border:none;
    border-radius:12px;
    background:rgba(255,255,255,0.15);
    color:white;
    outline:none;
}

input::placeholder{
    color:rgba(255,255,255,0.6);
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:12px;
    background:#2563eb;
    color:white;
    font-size:16px;
    cursor:pointer;
    margin-top:10px;
}

button:hover{
    background:#1d4ed8;
}

.login-link{
    text-align:center;
    margin-top:20px;
}

.login-link a{
    color:#bfdbfe;
    text-decoration:none;
}

.login-link a:hover{
    text-decoration:underline;
    color:white;
}

.msg{
    text-align:center;
    margin-top:15px;
    font-weight:bold;
}

</style>
</head>

<body>

<div class="card">

    <div class="logo">
        <i class="ti ti-user-plus"></i>
    </div>

    <h2>Create Teacher Account</h2>

    <p class="subtitle">
        Register as a teacher
    </p>

    <div class="field">
        <label>Teacher ID</label>
        <input type="text"
        id="teacher_id"
        placeholder="TCH001">
    </div>

    <div class="field">
        <label>Full Name</label>
        <input type="text"
        id="name"
        placeholder="Enter Full Name">
    </div>

    <div class="field">
        <label>Email</label>
        <input type="email"
        id="email"
        placeholder="teacher@email.com">
    </div>

    <div class="field">
        <label>Department</label>
        <input type="text"
        id="department"
        placeholder="CSE">
    </div>

    <div class="field">
        <label>Password</label>
        <input type="password"
        id="password"
        placeholder="Enter Password">
    </div>

    <button onclick="register()">
        Create Account
    </button>

    <p id="msg" class="msg"></p>

    <div class="login-link">
        <a href="/teacher">
            Already have an account? Login
        </a>
    </div>

</div>

<script>

async function register(){

    const teacher_id =
    document.getElementById("teacher_id").value;

    const name =
    document.getElementById("name").value;

    const email =
    document.getElementById("email").value;

    const department =
    document.getElementById("department").value;

    const password =
    document.getElementById("password").value;

    const msg =
    document.getElementById("msg");

    if(
        !teacher_id ||
        !name ||
        !email ||
        !department ||
        !password
    ){
        msg.style.color = "#f87171";
        msg.innerHTML =
        "Please fill all fields";
        return;
    }

    try{

        const response = await fetch(
            "/teacher-register",
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    teacher_id,
                    name,
                    email,
                    department,
                    password
                })
            }
        );

        const data = await response.json();

        if(response.ok){

            msg.style.color = "#4ade80";
            msg.innerHTML = data.message;

            document.getElementById("teacher_id").value = "";
            document.getElementById("name").value = "";
            document.getElementById("email").value = "";
            document.getElementById("department").value = "";
            document.getElementById("password").value = "";

        }
        else{

            msg.style.color = "#f87171";
            msg.innerHTML = data.detail || "Registration Failed";
        }

    }
    catch(error){

        msg.style.color = "#f87171";
        msg.innerHTML = "Server Error";

        console.error(error);
    }
}

</script>

</body>
</html>
